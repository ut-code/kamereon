<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Exhibit</title>
    <style>
        /* ページ全体の余白をなくす */
        body {
            margin: 0;
            padding: 0;
            background-color: #111; 
            color: #fff;
            font-family: "Shippori Mincho", "Zen Old Mincho", serif; 
        }
        
       /* 1. ヘッダー */
        .site-header {
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center; 
            padding: 15px 0;
            top: 0;
            z-index: 100; /* レイヤー */
        }
        
        .site-header h1 {
            margin: 0;
            font-size: 50px;
            letter-spacing: 2px; 
        }

        /* 2. 画像と文字を入れる箱 */
        .gallery-container {
            position: relative; /* 文字配置の基準点 */
            width: 100%;
        }

        .background-img {
            width: 100%;
            display: block;
        }

        /* 3. 作者作品名 */
        .art-label {
            position: absolute; 
            background-color: rgba(0, 0, 0, 0.6); 
            padding: 5px 15px;
            border-left: 3px solid #d4af37; 
            font-size: 14px;
            
        }
    </style>
</head>
<body>
    
    <!-- ヘッダー部分 -->
    <header class="site-header">
        <h1>Exhibit</h1>
    </header>

    <!-- 作品名 -->
    <div class="gallery-container">
        
        <!-- 背景 -->
        <img src="images/bg/exhibit.webp" alt="背景" class="background-img">

        <!-- 作品名-->
        <div class="art-label" style="top: 5%; left: 10%;">
            葛飾北斎『神奈川沖浪裏』
        </div>

    </div>

</body>
</html>
